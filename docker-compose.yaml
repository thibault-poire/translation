services:
  database:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: translation
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
    volumes:
      - ./database/data:/var/lib/postgresql
    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080